spring.application.name=backend

# 1. MySQL Database Connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${MYSQL_DATABASE:cstucompass}
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# 2. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Redis Connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# 4. API prefix (ตอน deploy เป็น war ใช้ชื่อไฟล์ api.war แทน)
server.servlet.context-path=/api

# 5. TU API
tu.api.base-url=${TU_API_BASE_URL:https://restapi.tu.ac.th}
tu.api.application-key=${TU_API_KEY:}
