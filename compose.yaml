services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://backend-dev:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    profiles:
      - dev

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    ports:
      - "80:80"
    profiles:
      - prod

  mysql:
    image : mysql:8.4
    ports:
    - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    profiles:
      - be-dev
      - be-prod

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    profiles: 
      - be-dev
      - be-prod
  
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TU_API_KEY: ${TU_API_KEY}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - mysql
      - redis
    profiles:
      - be-dev

  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TU_API_KEY: ${TU_API_KEY}
    depends_on:
      - mysql
      - redis
    profiles:
      - be-prod

volumes:
  frontend_node_modules:
  mysql_data: